exposure:
  min_range_m: 0.0
  max_range_m: 250.0
  recognizability_d0_m: 80.0
  route_sample_step_m: 5.0
  reference_rays_per_pose: 3600

camera_profiles:
  default_profile_id: inspection_balanced
  profiles:
    - id: wide_survey
      label: Wide Survey
      description: Wider context view for public notice and broad situational awareness.
      camera:
        hfov_deg: 92.0
        vfov_deg: 58.0
        gimbal_pitch_deg: -42.0
        ray_width: 72
        ray_height: 40
        min_depth_m: 0.0
        max_depth_m: 220.0
    - id: inspection_balanced
      label: Balanced Inspection
      description: Default study camera balancing coverage, detail, and interactive speed.
      camera:
        hfov_deg: 78.0
        vfov_deg: 50.0
        gimbal_pitch_deg: -45.0
        ray_width: 80
        ray_height: 45
        min_depth_m: 0.0
        max_depth_m: 250.0
    - id: focused_detail
      label: Focused Detail
      description: Narrower detail view for closer inspection with a shorter effective depth.
      camera:
        hfov_deg: 56.0
        vfov_deg: 36.0
        gimbal_pitch_deg: -50.0
        ray_width: 120
        ray_height: 68
        min_depth_m: 5.0
        max_depth_m: 140.0

study:
  database_path: data/study_sessions.sqlite3
  completion_code_prefix: VEP
  completion_code_length: 8
  admin_key_env: VEP_ADMIN_KEY
  event_batch_limit: 100
  question_config_version: main-study-draft-v1
  required_completion_events:
    - initial_media_completed
    - disclosure_view_entered
    - media_review_completed
  cell_capacities:
    A: {M: 100, S: 100, V: 100}
    B: {M: 100, S: 100, V: 100}
    C: {M: 100, S: 100, V: 100}
    D: {M: 100, S: 100, V: 100}
