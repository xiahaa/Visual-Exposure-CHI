exposure:
  min_range_m: 0.0
  max_range_m: 250.0
  recognizability_d0_m: 80.0
  route_sample_step_m: 5.0
  reference_rays_per_pose: 3600

camera_profiles:
  default_profile_id: inspection_balanced
  profiles:
    - id: wide_survey
      label: Wide Survey
      description: Wider context view for public notice and broad situational awareness.
      camera:
        hfov_deg: 92.0
        vfov_deg: 58.0
        gimbal_pitch_deg: -42.0
        ray_width: 72
        ray_height: 40
        min_depth_m: 0.0
        max_depth_m: 220.0
    - id: inspection_balanced
      label: Balanced Inspection
      description: Default study camera balancing coverage, detail, and interactive speed.
      camera:
        hfov_deg: 78.0
        vfov_deg: 50.0
        gimbal_pitch_deg: -45.0
        ray_width: 80
        ray_height: 45
        min_depth_m: 0.0
        max_depth_m: 250.0
    - id: focused_detail
      label: Focused Detail
      description: Narrower detail view for closer inspection with a shorter effective depth.
      camera:
        hfov_deg: 56.0
        vfov_deg: 36.0
        gimbal_pitch_deg: -50.0
        ray_width: 120
        ray_height: 68
        min_depth_m: 5.0
        max_depth_m: 140.0

gaussian_assets:
  # Keep the established 2.4-million-splat scene as the formal-study default
  # until the paged high-quality profile has been accepted on target devices.
  default_profile_id: standard_v2
  profiles:
    - id: standard_v2
      label: Standard study scene
      description: Existing progressive 3x3 MatrixCity scene used by the current pilot.
      manifest_url: https://chi-privacy-study.oss-cn-beijing.aliyuncs.com/vep/matrixcity/v2/matrixcity-neighborhood-study-v2.json
      format: tiled
      fallback_profile_id: null
      max_concurrent_requests: 2
      max_resident_pages: 9
      load_timeout_ms: 90000
    - id: paged_v3
      label: High-quality paged scene
      description: SH3 MatrixCity pages streamed around the active camera corridor.
      manifest_url: https://chi-privacy-study.oss-cn-beijing.aliyuncs.com/vep/matrixcity/v3/renderer_manifest.json
      format: paged
      fallback_profile_id: standard_v2
      max_concurrent_requests: 2
      max_resident_pages: 6
      load_timeout_ms: 90000

study:
  database_path: data/study_sessions.sqlite3
  completion_code_prefix: VEP
  completion_code_length: 8
  admin_key_env: VEP_ADMIN_KEY
  event_batch_limit: 100
  question_config_version: main-study-draft-v1
  required_completion_events:
    - initial_media_completed
    - disclosure_view_entered
    - media_review_completed
  cell_capacities:
    A: {M: 100, S: 100, V: 100}
    B: {M: 100, S: 100, V: 100}
    C: {M: 100, S: 100, V: 100}
    D: {M: 100, S: 100, V: 100}
